services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.9.8
    environment:
      CLICKHOUSE_PASSWORD: otel
    ports:
      - "28124:8123"
      - "29100:9000"
      - "29192:9092"
    volumes:
      - ../clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config.d/system-logs-ttl.xml:/etc/clickhouse-server/config.d/system-logs-ttl.xml:ro
      - ./clickhouse/config.d/logging.xml:/etc/clickhouse-server/config.d/bench-logging.xml:ro
      - ../clickhouse/users.d/timeseries.xml:/etc/clickhouse-server/users.d/timeseries.xml:ro
      - clickhouse_data:/var/lib/clickhouse
    tmpfs:
      - /var/log/clickhouse-server
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  clickhouse-init:
    image: clickhouse/clickhouse-server:26.3.9.8
    depends_on:
      - clickhouse
    volumes:
      - ../clickhouse/init.sql:/init.sql:ro
    entrypoint:
      - /bin/bash
      - -ec
      - |
        for i in $(seq 1 60); do
          clickhouse-client --host clickhouse --user default --password otel --query 'SELECT 1' && break
          sleep 1
        done
        clickhouse-client --host clickhouse --user default --password otel --multiquery < /init.sql
    restart: "no"
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  prometheus:
    image: prom/prometheus:v3.5.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --web.enable-admin-api
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=10y
      - --enable-feature=promql-binop-fill-modifiers,promql-experimental-functions
    ports:
      - "29190:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  promshim:
    build:
      context: ../..
      dockerfile: harness/Dockerfile
      target: promshim
    depends_on:
      - clickhouse
    environment:
      PROM_SHIM_CLICKHOUSE_TRANSPORT: ${PROM_SHIM_CLICKHOUSE_TRANSPORT:-native}
      PROM_SHIM_CLICKHOUSE_SETTINGS_PROFILE: ${PROM_SHIM_CLICKHOUSE_SETTINGS_PROFILE:-default_safe}
      PROM_SHIM_COST_ROUTING_LOCAL_FAMILIES: ${PROM_SHIM_COST_ROUTING_LOCAL_FAMILIES:-}
      PROM_SHIM_DISABLE_OPTIMIZED_IR: ${PROM_SHIM_DISABLE_OPTIMIZED_IR:-}
      PROM_SHIM_DISABLE_NATIVE_AGGREGATION_LABEL_PROJECTION: ${PROM_SHIM_DISABLE_NATIVE_AGGREGATION_LABEL_PROJECTION:-}
      PROM_SHIM_CLICKHOUSE_ENDPOINT: http://clickhouse:8123/
      PROM_SHIM_CLICKHOUSE_NATIVE_ADDR: clickhouse:9000
      PROM_SHIM_CLICKHOUSE_DATABASE: observability
      PROM_SHIM_CLICKHOUSE_TABLE: prometheus
      PROM_SHIM_CLICKHOUSE_USERNAME: default
      PROM_SHIM_CLICKHOUSE_PASSWORD: otel
      PROM_SHIM_LISTEN_ADDR: :9090
      PROM_SHIM_ENABLE_PPROF: "1"
      PROM_SHIM_MAX_RANGE_POINTS_PER_SERIES: 100000
      PROM_SHIM_RANGE_CHUNK_POINTS_PER_SERIES: 10000
      PROM_SHIM_MAX_RESPONSE_SERIES: 100000
      PROM_SHIM_MAX_RESPONSE_POINTS: 2000000
    ports:
      - "29191:9090"
    logging:
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  clickhouse_data:
    name: promshim_bench_clickhouse_data
  prometheus_data:
    name: promshim_bench_prometheus_data
