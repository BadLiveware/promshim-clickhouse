reference_target_config:
  query_url: 'http://localhost:29090'

test_target_config:
  query_url: 'http://localhost:29091'

query_time_parameters:
  # Pin end_time inside the fixture window. Target: FIXTURE_END - 5min
  # (leaves margin for the corpus's [1h] lookback and first-scrape noise).
  # Edit this after running `docker compose stop prometheus`.
  end_time: '2026-04-21T21:45:42Z'
  range_in_seconds: 600
  resolution_in_seconds: 10

# Start strict — Prometheus-default float tolerance (fraction 1e-5).
# If you see systematic float drift from ClickHouse Gorilla codec round-trips:
#   - note: 'Relax float tolerance for Gorilla round-trip precision'
#     adjust_value_tolerance:
#       fraction: 0.0001
# If the shim emits extra labels:
#   - drop_result_labels: [label_name]
query_tweaks: []
