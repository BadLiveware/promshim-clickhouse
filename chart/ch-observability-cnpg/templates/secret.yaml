{{- if .Values.operator.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.secretName | default "grafana-db" }}
  namespace: {{ .Release.Namespace }}
  labels:
    cnpg.io/reload: "true"
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cluster.user | default "grafana" }}
  password: {{ .Values.cluster.password | default "grafana" }}
{{- end }}
