name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.11.4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          go install gotest.tools/gotestsum@latest
          golangci-lint version
          gotestsum --version
          shellcheck --version
          yamllint --version

      - name: Run fast checks
        run: make fmt-check tidy-check lint script-check config-check build vet

      - name: Run unit tests
        if: always()
        run: make test-report

      - name: Publish unit test report
        if: always() && hashFiles('harness/artifacts/unit/junit-*.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Go unit test report
          report_paths: harness/artifacts/unit/junit-*.xml
          fail_on_failure: false
          require_tests: true

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-artifacts
          path: harness/artifacts/unit
          if-no-files-found: ignore

  compliance:
    name: PromQL compliance
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install test report tools
        run: |
          go install gotest.tools/gotestsum@latest
          gotestsum --version

      - name: Run full compliance suite
        run: scripts/run-compliance.sh --run-integration-tests

      - name: Generate compliance reports
        if: always()
        run: harness/compliance/scripts/export-ci-reports.sh

      - name: Publish compliance test report
        if: always() && hashFiles('harness/artifacts/compliance/*/ci/junit-*.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: PromQL compliance report
          report_paths: harness/artifacts/compliance/*/ci/junit-*.xml
          fail_on_failure: false
          require_tests: true

      - name: Publish integration test report
        if: always() && hashFiles('harness/artifacts/integration/junit-*.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Go integration test report
          report_paths: harness/artifacts/integration/junit-*.xml
          fail_on_failure: false
          require_tests: true

      - name: Add compliance summary
        if: always() && hashFiles('harness/artifacts/compliance/*/ci/summary.md') != ''
        run: cat harness/artifacts/compliance/*/ci/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-artifacts
          path: harness/artifacts/compliance
          if-no-files-found: ignore

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-artifacts
          path: harness/artifacts/integration
          if-no-files-found: ignore
