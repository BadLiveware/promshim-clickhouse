global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs: []
  # - job_name: 'demo'
  #   static_configs:
  #     - targets:
  #         - 'demo.promlabs.com:10000'
  #         - 'demo.promlabs.com:10001'
  #         - 'demo.promlabs.com:10002'

remote_write:
  - url: http://clickhouse:9092/write
    basic_auth:
      username: default
      password: otel
    queue_config:
      capacity: 10000
      max_samples_per_send: 2000
      batch_send_deadline: 1s

storage:
  tsdb:
    # Wide enough that scripts/seed-long-range.sh --profile 1y stays
    # in-window regardless of wall-clock drift; matches the stack's
    # retention.time=10y so nothing gets dropped silently.
    out_of_order_time_window: 10y
